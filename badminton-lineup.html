<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球臨打排點系統</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #EDEAE2; color: #16233A; }
        .font-num { font-family: 'Oswald', 'Noto Sans TC', sans-serif; }
        .bl-scroll::-webkit-scrollbar { width: 6px; }
        .bl-scroll::-webkit-scrollbar-thumb { background: #c8c2b0; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Simple helper icons via Lucide or SVG fallback/lucide initialization
        // We will define lightweight SVG components or wrapper for lucide icons
        const Icon = ({ name, size = 16, className = "", style = {} }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block', verticalAlign: 'middle', ...style }} className={className}></i>;
        };

        const LEVELS = [
            { v: 1, label: "新手", color: "#7C9A8E" },
            { v: 2, label: "初階", color: "#4F8F73" },
            { v: 3, label: "中階", color: "#F4C752" },
            { v: 4, label: "中高階", color: "#E8944C" },
            { v: 5, label: "高階", color: "#E8604C" },
        ];

        const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
        const levelInfo = (v) => LEVELS.find((l) => l.v === v) || LEVELS[0];

        function emptyGroup(name, courts, mode) {
            return {
                name,
                courts,
                mode,
                mixed: false,
                courtsState: Array.from({ length: courts }, () => ({ matchIds: null, startedAt: null })),
                players: [],
            };
        }

        function resizeCourts(group, newCount) {
            let courtsState = [...group.courtsState];
            let players = [...group.players];
            if (newCount < courtsState.length) {
                const removed = courtsState.slice(newCount);
                removed.forEach((c) => {
                    if (c.matchIds) {
                        const ids = new Set(c.matchIds);
                        players = players.map((p) => (ids.has(p.id) ? { ...p, status: "waiting", joinedAt: Date.now() } : p));
                    }
                });
                courtsState = courtsState.slice(0, newCount);
            } else if (newCount > courtsState.length) {
                const add = newCount - courtsState.length;
                for (let i = 0; i < add; i++) courtsState.push({ matchIds: null, startedAt: null });
            }
            return { ...group, courts: newCount, courtsState, players };
        }

        function autoAssign(group) {
            const courtsState = group.courtsState.map((c) => ({ ...c }));
            const perCourt = group.mode === "singles" ? 2 : 4;
            const assigned = new Set();
            let changed = false;
            const now = Date.now();

            for (let i = 0; i < courtsState.length; i++) {
                if (courtsState[i].matchIds) continue;
                let pool = group.players
                    .filter((p) => p.status === "waiting" && !assigned.has(p.id))
                    .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.joinedAt - b.joinedAt);

                let chosen = null;
                if (group.mode === "doubles" && group.mixed) {
                    const males = pool.filter((p) => p.gender === "M");
                    const females = pool.filter((p) => p.gender === "F");
                    if (males.length >= 2 && females.length >= 2) {
                        chosen = [males[0], males[1], females[0], females[1]];
                    }
                } else if (pool.length >= perCourt) {
                    chosen = pool.slice(0, perCourt);
                }

                if (chosen) {
                    chosen.forEach((p) => assigned.add(p.id));
                    courtsState[i] = { matchIds: chosen.map((p) => p.id), startedAt: now };
                    changed = true;
                }
            }

            if (!changed) return { group, filled: 0 };
            const players = group.players.map((p) => (assigned.has(p.id) ? { ...p, status: "playing" } : p));
            const filled = courtsState.filter((c, i) => c.matchIds && !group.courtsState[i].matchIds).length;
            return { group: { ...group, courtsState, players }, filled };
        }

        function endMatch(group, courtIdx) {
            const court = group.courtsState[courtIdx];
            if (!court || !court.matchIds) return group;
            const ids = new Set(court.matchIds);
            const now = Date.now();
            const players = group.players.map((p) =>
                ids.has(p.id) ? { ...p, status: "waiting", gamesPlayed: p.gamesPlayed + 1, joinedAt: now } : p
            );
            const courtsState = group.courtsState.map((c, i) => (i === courtIdx ? { matchIds: null, startedAt: null } : c));
            return { ...group, players, courtsState };
        }

        function fmtElapsed(startedAt, now) {
            const s = Math.max(0, Math.floor((now - startedAt) / 1000));
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
        }

        function fmtWait(joinedAt, now) {
            const m = Math.max(0, Math.floor((now - joinedAt) / 60000));
            return m < 1 ? "剛加入" : `等待 ${m} 分`;
        }

        function BadmintonLineup() {
            const [ready, setReady] = useState(false);
            const [groupsIndex, setGroupsIndex] = useState([]);
            const [activeId, setActiveId] = useState(null);
            const [group, setGroup] = useState(null);
            const [now, setNow] = useState(Date.now());
            const [showNewGroup, setShowNewGroup] = useState(false);
            const [newGroupName, setNewGroupName] = useState("");
            const [newGroupCourts, setNewGroupCourts] = useState(6);
            const [newGroupMode, setNewGroupMode] = useState("doubles");
            const [confirmDelete, setConfirmDelete] = useState(false);
            const [showRest, setShowRest] = useState(false);
            const [selected, setSelected] = useState([]);
            const [pName, setPName] = useState("");
            const [pLevel, setPLevel] = useState(3);
            const [pGender, setPGender] = useState("M");
            const [assignMsg, setAssignMsg] = useState("");
            const skipSave = useRef(false);

            useEffect(() => {
                const t = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                try {
                    const r = localStorage.getItem("badminton-groups-index");
                    const idx = r ? JSON.parse(r) : [];
                    setGroupsIndex(idx);
                    if (idx.length > 0) {
                        loadGroup(idx[0].id);
                    }
                } catch (e) {
                    setGroupsIndex([]);
                }
                setReady(true);
            }, []);

            useEffect(() => {
                setTimeout(() => {
                    lucide.createIcons();
                }, 50);
            });

            function loadGroup(id) {
                try {
                    const r = localStorage.getItem(`badminton-group-${id}`);
                    const data = r ? JSON.parse(r) : null;
                    skipSave.current = true;
                    setActiveId(id);
                    setGroup(data);
                    setSelected([]);
                } catch (e) {
                    setGroup(null);
                }
            }

            useEffect(() => {
                if (!activeId || !group) return;
                if (skipSave.current) {
                    skipSave.current = false;
                    return;
                }
                try {
                    localStorage.setItem(`badminton-group-${activeId}`, JSON.stringify(group));
                } catch (e) {}
            }, [group, activeId]);

            function saveIndex(idx) {
                setGroupsIndex(idx);
                try {
                    localStorage.setItem("badminton-groups-index", JSON.stringify(idx));
                } catch (e) {}
            }

            function createGroup() {
                const name = newGroupName.trim() || "臨打團";
                const id = uid();
                const g = emptyGroup(name, newGroupCourts, newGroupMode);
                skipSave.current = false;
                const idx = [...groupsIndex, { id, name }];
                saveIndex(idx);
                try {
                    localStorage.setItem(`badminton-group-${id}`, JSON.stringify(g));
                } catch (e) {}
                setActiveId(id);
                setGroup(g);
                setSelected([]);
                setShowNewGroup(false);
                setNewGroupName("");
                setNewGroupCourts(6);
                setNewGroupMode("doubles");
            }

            function deleteGroup() {
                const idx = groupsIndex.filter((g) => g.id !== activeId);
                try {
                    localStorage.removeItem(`badminton-group-${activeId}`);
                } catch (e) {}
                saveIndex(idx);
                setConfirmDelete(false);
                if (idx.length > 0) {
                    loadGroup(idx[0].id);
                } else {
                    setActiveId(null);
                    setGroup(null);
                }
            }

            function update(fn) {
                setGroup((prev) => fn(prev));
            }

            function addPlayer() {
                const name = pName.trim();
                if (!name) return;
                update((g) => ({
                    ...g,
                    players: [
                        ...g.players,
                        { id: uid(), name, level: pLevel, gender: pGender, status: "waiting", gamesPlayed: 0, joinedAt: Date.now() },
                    ],
                }));
                setPName("");
            }

            function removePlayer(id) {
                update((g) => ({ ...g, players: g.players.filter((p) => p.id !== id) }));
                setSelected((s) => s.filter((x) => x !== id));
            }

            function toggleRest(id) {
                update((g) => ({
                    ...g,
                    players: g.players.map((p) =>
                        p.id === id
                            ? { ...p, status: p.status === "resting" ? "waiting" : "resting", joinedAt: Date.now() }
                            : p
                    ),
                }));
                setSelected((s) => s.filter((x) => x !== id));
            }

            function toggleSelect(id) {
                const perCourt = group.mode === "singles" ? 2 : 4;
                setSelected((s) => {
                    if (s.includes(id)) return s.filter((x) => x !== id);
                    if (s.length >= perCourt) return s;
                    return [...s, id];
                });
            }

            function assignManual(courtIdx) {
                const perCourt = group.mode === "singles" ? 2 : 4;
                if (selected.length !== perCourt) return;
                const now2 = Date.now();
                update((g) => ({
                    ...g,
                    courtsState: g.courtsState.map((c, i) => (i === courtIdx ? { matchIds: [...selected], startedAt: now2 } : c)),
                    players: g.players.map((p) => (selected.includes(p.id) ? { ...p, status: "playing" } : p)),
                }));
                setSelected([]);
            }

            function handleEnd(courtIdx) {
                update((g) => endMatch(g, courtIdx));
            }

            function handleAutoAssign() {
                const { group: next, filled } = autoAssign(group);
                setGroup(next);
                setAssignMsg(filled > 0 ? `已排入 ${filled} 場` : "候補人數不足或條件不符，無法排入新的場次");
                setTimeout(() => setAssignMsg(""), 3000);
            }

            function changeCourts(delta) {
                const n = Math.max(1, Math.min(20, group.courts + delta));
                if (n === group.courts) return;
                update((g) => resizeCourts(g, n));
            }

            if (!ready) {
                return <div className="p-10 text-emerald-800">載入中…</div>;
            }

            return (
                <div className="max-w-6xl mx-auto bg-[#EDEAE2] text-[#16233A] p-4 md:p-6 rounded-2xl shadow-lg">
                    {groupsIndex.length === 0 && !showNewGroup && (
                        <div className="text-center py-20">
                            <h1 className="text-2xl font-black mb-2">建立第一個羽球臨打團</h1>
                            <p className="text-gray-600 mb-6">設定場地數與比賽模式，開始管理報名與排點</p>
                            <button
                                onClick={() => setShowNewGroup(true)}
                                className="bg-[#1F6650] text-white px-6 py-3 rounded-xl font-bold inline-flex items-center gap-2 hover:bg-[#164C3B] transition"
                            >
                                <Icon name="plus" size={18} /> 新增球團
                            </button>
                        </div>
                    )}

                    {(groupsIndex.length > 0 || showNewGroup) && (
                        <>
                            {/* Header */}
                            <div className="flex flex-wrap items-center gap-3 mb-5">
                                <div className="text-2xl font-black tracking-tight">
                                    {group && <span>{group.name}</span>}
                                </div>

                                {groupsIndex.length > 0 && (
                                    <div className="relative">
                                        <select
                                            value={activeId || ""}
                                            onChange={(e) => loadGroup(e.target.value)}
                                            className="appearance-none bg-white border border-[#d8d2c0] rounded-lg px-3 py-2 text-sm font-medium text-[#16233A] cursor-pointer pr-8"
                                        >
                                            {groupsIndex.map((g) => (
                                                <option key={g.id} value={g.id}>{g.name}</option>
                                            ))}
                                        </select>
                                        <Icon name="chevron-down" size={14} className="absolute right-2.5 top-3 pointer-events-none text-gray-500" />
                                    </div>
                                )}

                                <button
                                    onClick={() => setShowNewGroup((v) => !v)}
                                    className="bg-white border border-[#d8d2c0] rounded-lg px-3 py-2 text-sm font-medium inline-flex items-center gap-1.5 hover:bg-gray-50 transition"
                                >
                                    <Icon name="plus" size={14} /> 新增球團
                                </button>

                                {group && (
                                    <div className="ml-auto flex items-center gap-3 flex-wrap">
                                        <div className="flex items-center gap-2 bg-white border border-[#d8d2c0] rounded-lg px-3 py-1.5">
                                            <span className="text-xs text-gray-500">場地</span>
                                            <button onClick={() => changeCourts(-1)} className="p-1 hover:bg-gray-100 rounded"><Icon name="minus" size={14} /></button>
                                            <span className="font-num text-base font-semibold w-5 text-center">{group.courts}</span>
                                            <button onClick={() => changeCourts(1)} className="p-1 hover:bg-gray-100 rounded"><Icon name="plus" size={14} /></button>
                                        </div>

                                        <select
                                            value={group.mode}
                                            onChange={(e) => update((g) => ({ ...g, mode: e.target.value, mixed: e.target.value === "singles" ? false : g.mixed }))}
                                            className="bg-white border border-[#d8d2c0] rounded-lg px-3 py-1.5 text-sm"
                                        >
                                            <option value="doubles">雙打</option>
                                            <option value="singles">單打</option>
                                        </select>

                                        {group.mode === "doubles" && (
                                            <label className="flex items-center gap-1.5 text-sm text-gray-600 cursor-pointer">
                                                <input type="checkbox" checked={group.mixed} onChange={(e) => update((g) => ({ ...g, mixed: e.target.checked }))} />
                                                混雙限定
                                            </label>
                                        )}

                                        {!confirmDelete ? (
                                            <button onClick={() => setConfirmDelete(true)} className="p-1.5 text-gray-500 hover:text-red-600 transition" title="刪除球團">
                                                <Icon name="trash-2" size={16} />
                                            </button>
                                        ) : (
                                            <div className="flex gap-2 items-center text-xs">
                                                <span className="text-red-600 font-bold">確定刪除？</span>
                                                <button onClick={deleteGroup} className="bg-red-600 text-white rounded px-2 py-1 font-bold">刪除</button>
                                                <button onClick={() => setConfirmDelete(false)} className="bg-white border border-[#d8d2c0] rounded px-2 py-1">取消</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {showNewGroup && (
                                <div className="bg-white border border-[#d8d2c0] rounded-xl p-4 mb-5 flex flex-wrap gap-3 items-end shadow-sm">
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">球團名稱</label>
                                        <input
                                            value={newGroupName}
                                            onChange={(e) => setNewGroupName(e.target.value)}
                                            placeholder="例如：週三晚場臨打團"
                                            className="border border-[#d8d2c0] rounded-lg px-3 py-2 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-emerald-600"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">場地數</label>
                                        <input
                                            type="number" min={1} max={20} value={newGroupCourts}
                                            onChange={(e) => setNewGroupCourts(Math.max(1, Math.min(20, Number(e.target.value) || 1)))}
                                            className="border border-[#d8d2c0] rounded-lg px-3 py-2 text-sm w-20 focus:outline-none focus:ring-2 focus:ring-emerald-600"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">模式</label>
                                        <select value={newGroupMode} onChange={(e) => setNewGroupMode(e.target.value)} className="border border-[#d8d2c0] rounded-lg px-3 py-2 text-sm">
                                            <option value="doubles">雙打</option>
                                            <option value="singles">單打</option>
                                        </select>
                                    </div>
                                    <button onClick={createGroup} className="bg-[#1F6650] text-white rounded-lg px-4 py-2 text-sm font-bold hover:bg-[#164C3B] transition">建立</button>
                                    <button onClick={() => setShowNewGroup(false)} className="text-gray-500 text-sm px-2 py-2">取消</button>
                                </div>
                            )}

                            {group && (
                                <div className="flex gap-5 flex-wrap lg:flex-nowrap items-start">
                                    {/* Courts Grid */}
                                    <div className="flex-1 w-full">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                                            {group.courtsState.map((c, i) => {
                                                const perCourt = group.mode === "singles" ? 2 : 4;
                                                const canManualAssign = !c.matchIds && selected.length === perCourt;
                                                return (
                                                    <div
                                                        key={i}
                                                        className={`rounded-xl min-h-[168px] p-4 flex flex-col transition shadow-sm ${
                                                            c.matchIds ? "bg-[#1F6650] text-white" : "bg-white border-2 border-dashed border-[#cfc8b3]"
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center mb-3">
                                                            <span className={`font-num text-xs font-semibold tracking-wide ${c.matchIds ? "opacity-85" : "opacity-60"}`}>
                                                                場地 {i + 1}
                                                            </span>
                                                            {c.matchIds ? (
                                                                <span className="flex items-center gap-1 font-num text-sm font-bold">
                                                                    <Icon name="clock" size={13} /> {fmtElapsed(c.startedAt, now)}
                                                                </span>
                                                            ) : (
                                                                <span className="text-xs text-gray-400">空場</span>
                                                            )}
                                                        </div>

                                                        {c.matchIds ? (
                                                            <>
                                                                <div className="flex-1 flex flex-col gap-1.5 mb-3">
                                                                    {c.matchIds.map((pid) => {
                                                                        const p = group.players.find((x) => x.id === pid);
                                                                        if (!p) return null;
                                                                        const lv = levelInfo(p.level);
                                                                        return (
                                                                            <div key={pid} className="flex items-center gap-2 text-sm">
                                                                                <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: lv.color }} />
                                                                                <span className="font-medium">{p.name}</span>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                                <button
                                                                    onClick={() => handleEnd(i)}
                                                                    className="bg-white/15 hover:bg-white/25 text-white rounded-lg py-1.5 text-xs font-semibold flex items-center justify-center gap-1.5 transition"
                                                                >
                                                                    <Icon name="square" size={12} /> 結束比賽
                                                                </button>
                                                            </>
                                                        ) : (
                                                            <div className="flex-1 flex items-center justify-center">
                                                                <button
                                                                    disabled={!canManualAssign}
                                                                    onClick={() => assignManual(i)}
                                                                    className={`text-xs font-bold rounded-lg px-3 py-2 transition ${
                                                                        canManualAssign
                                                                            ? "bg-[#F4C752] text-[#4A3708] hover:bg-amber-400 cursor-pointer shadow"
                                                                            : "bg-[#f1efe6] text-[#a9a290] cursor-default"
                                                                    }`}
                                                                >
                                                                    {canManualAssign ? `指派 ${selected.length} 人到此場` : `選 ${perCourt} 位候補後指派`}
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Sidebar */}
                                    <div className="w-full lg:w-80 flex-shrink-0 bg-[#E2DECF] rounded-xl p-4 shadow-sm">
                                        <button
                                            onClick={handleAutoAssign}
                                            className="w-full bg-[#F4C752] hover:bg-amber-400 text-[#4A3708] rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2 mb-2 shadow transition"
                                        >
                                            <Icon name="shuffle" size={16} /> 自動排點
                                        </button>
                                        {assignMsg && <div className="text-xs text-gray-600 text-center mb-2">{assignMsg}</div>}

                                        <div className="flex gap-1.5 mb-3.5">
                                            <input
                                                value={pName}
                                                onChange={(e) => setPName(e.target.value)}
                                                onKeyDown={(e) => e.key === "Enter" && addPlayer()}
                                                placeholder="球友姓名"
                                                className="flex-1 border border-[#d8d2c0] rounded-lg px-2.5 py-1.5 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-emerald-600 min-w-0"
                                            />
                                            <select value={pLevel} onChange={(e) => setPLevel(Number(e.target.value))} className="border border-[#d8d2c0] rounded-lg px-1 py-1 text-xs bg-white">
                                                {LEVELS.map((l) => <option key={l.v} value={l.v}>{l.label}</option>)}
                                            </select>
                                            <select value={pGender} onChange={(e) => setPGender(e.target.value)} className="border border-[#d8d2c0] rounded-lg px-1 py-1 text-xs bg-white">
                                                <option value="M">男</option>
                                                <option value="F">女</option>
                                            </select>
                                            <button onClick={addPlayer} className="bg-[#1F6650] hover:bg-[#164C3B] text-white rounded-lg px-3 py-1.5 transition flex items-center justify-center">
                                                <Icon name="plus" size={16} />
                                            </button>
                                        </div>

                                        <div className="flex items-center gap-1.5 text-xs font-bold text-gray-600 mb-2">
                                            <Icon name="users" size={13} /> 候補中（{group.players.filter((p) => p.status === "waiting").length}）
                                        </div>

                                        <div className="bl-scroll max-h-[340px] overflow-y-auto flex flex-col gap-1.5 mb-3 pr-1">
                                            {group.players
                                                .filter((p) => p.status === "waiting")
                                                .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.joinedAt - b.joinedAt)
                                                .map((p) => {
                                                    const lv = levelInfo(p.level);
                                                    const isSel = selected.includes(p.id);
                                                    return (
                                                        <div
                                                            key={p.id}
                                                            onClick={() => toggleSelect(p.id)}
                                                            className={`flex items-center gap-2 rounded-lg p-2 cursor-pointer transition border ${
                                                                isSel ? "bg-[#FCEFC8] border-[#F4C752]" : "bg-white border-[#e5e0d1] hover:bg-gray-50"
                                                            }`}
                                                        >
                                                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: lv.color }} />
                                                            <div className="flex-1 min-w-0">
                                                                <div className="text-xs font-semibold truncate">{p.name}</div>
                                                                <div className="text-[10px] text-gray-500">
                                                                    {lv.label} · {p.gender === "M" ? "男" : "女"} · 已上 {p.gamesPlayed} 場 · {fmtWait(p.joinedAt, now)}
                                                                </div>
                                                            </div>
                                                            <button onClick={(e) => { e.stopPropagation(); toggleRest(p.id); }} className="p-1 text-gray-400 hover:text-gray-700 transition" title="標記休息">
                                                                <Icon name="coffee" size={13} />
                                                            </button>
                                                            <button onClick={(e) => { e.stopPropagation(); removePlayer(p.id); }} className="p-1 text-gray-400 hover:text-red-600 transition" title="移除">
                                                                <Icon name="x" size={13} />
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                            {group.players.filter((p) => p.status === "waiting").length === 0 && (
                                                <div className="text-xs text-gray-500 py-2">目前沒有候補球友，新增球友開始排點。</div>
                                            )}
                                        </div>

                                        <button
                                            onClick={() => setShowRest((v) => !v)}
                                            className="text-gray-600 text-xs flex items-center gap-1 py-1 font-medium hover:text-gray-900 transition"
                                        >
                                            <Icon name="circle-dot" size={12} /> 休息中（{group.players.filter((p) => p.status === "resting").length}）
                                            <Icon name="chevron-down" size={12} style={{ transform: showRest ? "rotate(180deg)" : "none" }} />
                                        </button>
                                        {showRest && (
                                            <div className="flex flex-col gap-1.5 mt-2">
                                                {group.players.filter((p) => p.status === "resting").map((p) => (
                                                    <div key={p.id} className="flex items-center gap-2 bg-white border border-[#e5e0d1] rounded-lg px-2.5 py-1.5">
                                                        <div className="flex-1 text-xs">{p.name}</div>
                                                        <button onClick={() => toggleRest(p.id)} className="bg-[#1F6650] text-white rounded px-2 py-0.5 text-[10px] font-bold">
                                                            恢復候補
                                                        </button>
                                                    </div>
                                                ))}
                                                {group.players.filter((p) => p.status === "resting").length === 0 && (
                                                    <div className="text-[11px] text-gray-500">沒有休息中的球友。</div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </>
                    );
                }

                ReactDOM.createRoot(document.getElementById("root")).render(<BadmintonLineup />);
    </script>
</body>
</html>
