<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球臨打排點系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #EDEAE2; color: #16233A; margin: 0; padding: 16px; }
        .font-num { font-family: 'Oswald', 'Noto Sans TC', sans-serif; }
        .bl-scroll::-webkit-scrollbar { width: 6px; }
        .bl-scroll::-webkit-scrollbar-thumb { background: #c8c2b0; border-radius: 4px; }
        .bl-btn { cursor: pointer; border: none; font-family: inherit; }
        .bl-btn:active { transform: scale(0.97); }
        .bl-row { transition: background 0.15s, border-color 0.15s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 16, className = "", style = {} }) => {
            useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            });
            const iconMap = {
                'plus': 'plus',
                'trash-2': 'trash-2',
                'shuffle': 'shuffle',
                'x': 'x',
                'users': 'users',
                'coffee': 'coffee',
                'square': 'square',
                'chevron-down': 'chevron-down',
                'minus': 'minus',
                'clock': 'clock',
                'circle-dot': 'circle-dot',
                'upload': 'upload'
            };
            const lucideName = iconMap[name] || name;
            return <i data-lucide={lucideName} style={{ width: size, height: size, display: 'inline-block', verticalAlign: 'middle', fontStyle: 'normal', ...style }} className={className}></i>;
        };

        const LEVELS = [
            { v: 1, label: "新手", color: "#7C9A8E" },
            { v: 2, label: "初階", color: "#4F8F73" },
            { v: 3, label: "中階", color: "#F4C752" },
            { v: 4, label: "中高階", color: "#E8944C" },
            { v: 5, label: "高階", color: "#E8604C" },
        ];

        const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
        const levelInfo = (v) => LEVELS.find((l) => l.v === v) || LEVELS[0];

        function emptyGroup(name, courts, mode) {
            return {
                name,
                courts,
                mode,
                mixed: false,
                courtsState: Array.from({ length: courts }, () => ({ matchIds: null, startedAt: null })),
                players: [],
            };
        }

        function resizeCourts(group, newCount) {
            let courtsState = [...group.courtsState];
            let players = [...group.players];
            if (newCount < courtsState.length) {
                const removed = courtsState.slice(newCount);
                removed.forEach((c) => {
                    if (c.matchIds) {
                        const ids = new Set(c.matchIds);
                        players = players.map((p) => (ids.has(p.id) ? { ...p, status: "waiting", joinedAt: Date.now() } : p));
                    }
                });
                courtsState = courtsState.slice(0, newCount);
            } else if (newCount > courtsState.length) {
                const add = newCount - courtsState.length;
                for (let i = 0; i < add; i++) courtsState.push({ matchIds: null, startedAt: null });
            }
            return { ...group, courts: newCount, courtsState, players };
        }

        function autoAssign(group) {
            const courtsState = group.courtsState.map((c) => ({ ...c }));
            const perCourt = group.mode === "singles" ? 2 : 4;
            const assigned = new Set();
            let changed = false;
            const now = Date.now();

            for (let i = 0; i < courtsState.length; i++) {
                if (courtsState[i].matchIds) continue;
                let pool = group.players
                    .filter((p) => p.status === "waiting" && !assigned.has(p.id))
                    .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.joinedAt - b.joinedAt);

                let chosen = null;
                if (group.mode === "doubles" && group.mixed) {
                    const males = pool.filter((p) => p.gender === "M");
                    const females = pool.filter((p) => p.gender === "F");
                    if (males.length >= 2 && females.length >= 2) {
                        chosen = [males[0], males[1], females[0], females[1]];
                    }
                } else if (pool.length >= perCourt) {
                    chosen = pool.slice(0, perCourt);
                }

                if (chosen) {
                    chosen.forEach((p) => assigned.add(p.id));
                    courtsState[i] = { matchIds: chosen.map((p) => p.id), startedAt: now };
                    changed = true;
                }
            }

            if (!changed) return { group, filled: 0 };
            const players = group.players.map((p) => (assigned.has(p.id) ? { ...p, status: "playing" } : p));
            const filled = courtsState.filter((c, i) => c.matchIds && !group.courtsState[i].matchIds).length;
            return { group: { ...group, courtsState, players }, filled };
        }

        function endMatch(group, courtIdx) {
            const court = group.courtsState[courtIdx];
            if (!court || !court.matchIds) return group;
            const ids = new Set(court.matchIds);
            const now = Date.now();
            const players = group.players.map((p) =>
                ids.has(p.id) ? { ...p, status: "waiting", gamesPlayed: p.gamesPlayed + 1, joinedAt: now } : p
            );
            const courtsState = group.courtsState.map((c, i) => (i === courtIdx ? { matchIds: null, startedAt: null } : c));
            return { ...group, players, courtsState };
        }

        function fmtElapsed(startedAt, now) {
            const s = Math.max(0, Math.floor((now - startedAt) / 1000));
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
        }

        function fmtWait(joinedAt, now) {
            const m = Math.max(0, Math.floor((now - joinedAt) / 60000));
            return m < 1 ? "剛加入" : `等待 ${m} 分`;
        }

        function parseImportLines(text) {
            const levelMap = {};
            LEVELS.forEach((l) => { levelMap[l.label] = l.v; });
            return text
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line) => {
                    const parts = line.split(/[,，\t]/).map((s) => s.trim()).filter(Boolean);
                    const name = parts[0];
                    let level = 3;
                    let gender = "M";
                    for (let i = 1; i < parts.length; i++) {
                        const seg = parts[i];
                        if (levelMap[seg] !== undefined) level = levelMap[seg];
                        else if (/^[1-5]$/.test(seg)) level = Number(seg);
                        else if (/^(m|男)$/i.test(seg)) gender = "M";
                        else if (/^(f|女)$/i.test(seg)) gender = "F";
                    }
                    return { name, level, gender };
                })
                .filter((p) => p.name);
        }

        function BadmintonLineup() {
            const [ready, setReady] = useState(false);
            const [storageOk, setStorageOk] = useState(true);
            const [groupsIndex, setGroupsIndex] = useState([]);
            const [activeId, setActiveId] = useState(null);
            const [group, setGroup] = useState(null);
            const [now, setNow] = useState(Date.now());
            const [showNewGroup, setShowNewGroup] = useState(false);
            const [newGroupName, setNewGroupName] = useState("");
            const [newGroupCourts, setNewGroupCourts] = useState(6);
            const [newGroupMode, setNewGroupMode] = useState("doubles");
            const [confirmDelete, setConfirmDelete] = useState(false);
            const [showRest, setShowRest] = useState(false);
            const [selected, setSelected] = useState([]);
            const [pName, setPName] = useState("");
            const [pLevel, setPLevel] = useState(3);
            const [pGender, setPGender] = useState("M");
            const [assignMsg, setAssignMsg] = useState("");
            const [showImport, setShowImport] = useState(false);
            const [importText, setImportText] = useState("");
            const skipSave = useRef(false);

            useEffect(() => {
                const t = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                try {
                    const r = localStorage.getItem("badminton-groups-index");
                    const idx = r ? JSON.parse(r) : [];
                    setGroupsIndex(idx);
                    if (idx.length > 0) {
                        loadGroup(idx[0].id);
                    }
                } catch (e) {
                    setGroupsIndex([]);
                }
                setReady(true);
            }, []);

            useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            });

            async function loadGroup(id) {
                try {
                    const r = localStorage.getItem(`badminton-group-${id}`);
                    const data = r ? JSON.parse(r) : null;
                    skipSave.current = true;
                    setActiveId(id);
                    setGroup(data);
                    setSelected([]);
                } catch (e) {
                    setGroup(null);
                }
            }

            useEffect(() => {
                if (!activeId || !group) return;
                if (skipSave.current) {
                    skipSave.current = false;
                    return;
                }
                try {
                    localStorage.setItem(`badminton-group-${activeId}`, JSON.stringify(group));
                } catch (e) {
                    setStorageOk(false);
                }
            }, [group, activeId]);

            function saveIndex(idx) {
                setGroupsIndex(idx);
                try {
                    localStorage.setItem("badminton-groups-index", JSON.stringify(idx));
                } catch (e) {
                    setStorageOk(false);
                }
            }

            function createGroup() {
                const name = newGroupName.trim() || "臨打團";
                const id = uid();
                const g = emptyGroup(name, newGroupCourts, newGroupMode);
                skipSave.current = false;
                const idx = [...groupsIndex, { id, name }];
                saveIndex(idx);
                try {
                    localStorage.setItem(`badminton-group-${id}`, JSON.stringify(g));
                } catch (e) {
                    setStorageOk(false);
                }
                setActiveId(id);
                setGroup(g);
                setSelected([]);
                setShowNewGroup(false);
                setNewGroupName("");
                setNewGroupCourts(6);
                setNewGroupMode("doubles");
            }

            function deleteGroup() {
                const idx = groupsIndex.filter((g) => g.id !== activeId);
                try {
                    localStorage.removeItem(`badminton-group-${activeId}`);
                } catch (e) {}
                saveIndex(idx);
                setConfirmDelete(false);
                if (idx.length > 0) {
                    loadGroup(idx[0].id);
                } else {
                    setActiveId(null);
                    setGroup(null);
                }
            }

            function update(fn) {
                setGroup((prev) => fn(prev));
            }

            function addPlayer() {
                const name = pName.trim();
                if (!name) return;
                update((g) => ({
                    ...g,
                    players: [
                        ...g.players,
                        { id: uid(), name, level: pLevel, gender: pGender, status: "waiting", gamesPlayed: 0, joinedAt: Date.now() },
                    ],
                }));
                setPName("");
            }

            function handleImportFile(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => setImportText(ev.target.result || "");
                reader.readAsText(file, "utf-8");
                e.target.value = "";
            }

            function confirmImport() {
                const parsed = parseImportLines(importText);
                if (parsed.length === 0) return;
                const base = Date.now();
                update((g) => ({
                    ...g,
                    players: [
                        ...g.players,
                        ...parsed.map((p, i) => ({
                            id: uid(),
                            name: p.name,
                            level: p.level,
                            gender: p.gender,
                            status: "waiting",
                            gamesPlayed: 0,
                            joinedAt: base + i,
                        })),
                    ],
                }));
                setImportText("");
                setShowImport(false);
            }

            function removePlayer(id) {
                update((g) => ({ ...g, players: g.players.filter((p) => p.id !== id) }));
                setSelected((s) => s.filter((x) => x !== id));
            }

            function toggleRest(id) {
                update((g) => ({
                    ...g,
                    players: g.players.map((p) =>
                        p.id === id
                            ? { ...p, status: p.status === "resting" ? "waiting" : "resting", joinedAt: Date.now() }
                            : p
                    ),
                }));
                setSelected((s) => s.filter((x) => x !== id));
            }

            function toggleSelect(id) {
                const perCourt = group.mode === "singles" ? 2 : 4;
                setSelected((s) => {
                    if (s.includes(id)) return s.filter((x) => x !== id);
                    if (s.length >= perCourt) return s;
                    return [...s, id];
                });
            }

            function assignManual(courtIdx) {
                const perCourt = group.mode === "singles" ? 2 : 4;
                if (selected.length !== perCourt) return;
                const now2 = Date.now();
                update((g) => ({
                    ...g,
                    courtsState: g.courtsState.map((c, i) => (i === courtIdx ? { matchIds: [...selected], startedAt: now2 } : c)),
                    players: g.players.map((p) => (selected.includes(p.id) ? { ...p, status: "playing" } : p)),
                }));
                setSelected([]);
            }

            function handleEnd(courtIdx) {
                update((g) => endMatch(g, courtIdx));
            }

            function handleAutoAssign() {
                const { group: next, filled } = autoAssign(group);
                setGroup(next);
                setAssignMsg(filled > 0 ? `已排入 ${filled} 場` : "候補人數不足或條件不符，無法排入新的場次");
                setTimeout(() => setAssignMsg(""), 3000);
            }

            function changeCourts(delta) {
                const n = Math.max(1, Math.min(20, group.courts + delta));
                if (n === group.courts) return;
                update((g) => resizeCourts(g, n));
            }

            if (!ready) {
                return <div style={{ fontFamily: "var(--f-body)", padding: 40, color: "#5B6B66" }}>載入中…</div>;
            }

            const rootStyle = {
                "--ink": "#16233A",
                "--court": "#1F6650",
                "--court-dark": "#164C3B",
                "--yellow": "#F4C752",
                "--coral": "#E8604C",
                "--paper": "#EDEAE2",
                "--panel": "#E2DECF",
                "--line": "rgba(255,255,255,0.55)",
                "--muted": "#66756E",
                "--f-body": "'Noto Sans TC', sans-serif",
                "--f-num": "'Oswald', 'Noto Sans TC', sans-serif",
                background: "var(--paper)",
                color: "var(--ink)",
                fontFamily: "var(--f-body)",
                minHeight: 640,
                padding: "24px",
                borderRadius: 16,
                maxWidth: 1200,
                margin: "0 auto",
                boxShadow: "0 10px 25px rgba(0,0,0,0.08)"
            };

            return (
                <div style={rootStyle}>
                    {groupsIndex.length === 0 && !showNewGroup && (
                        <div style={{ textAlign: "center", padding: "80px 20px" }}>
                            <h1 style={{ fontSize: 24, fontWeight: 900, margin: "0 0 8px" }}>建立第一個羽球臨打團</h1>
                            <p style={{ color: "var(--muted)", margin: "0 0 24px" }}>設定場地數與比賽模式，開始管理報名與排點</p>
                            <button
                                className="bl-btn"
                                onClick={() => setShowNewGroup(true)}
                                style={{ background: "var(--court)", color: "#fff", padding: "12px 24px", borderRadius: 10, fontSize: 15, fontWeight: 700, display: "inline-flex", alignItems: "center", gap: 8 }}
                            >
                                <Icon name="plus" size={18} /> 新增球團
                            </button>
                        </div>
                    )}

                    {(groupsIndex.length > 0 || showNewGroup) && (
                        <>
                            {/* Header */}
                            <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 12, marginBottom: 20 }}>
                                <div style={{ fontSize: 22, fontWeight: 900, letterSpacing: -0.5, display: "flex", alignItems: "center", gap: 8 }}>
                                    {group && <span>{group.name}</span>}
                                </div>

                                {groupsIndex.length > 0 && (
                                    <div style={{ position: "relative" }}>
                                        <select
                                            value={activeId || ""}
                                            onChange={(e) => loadGroup(e.target.value)}
                                            style={{
                                                appearance: "none", background: "#fff", border: "1px solid #d8d2c0", borderRadius: 8,
                                                padding: "8px 32px 8px 12px", fontSize: 13, fontWeight: 500, color: "var(--ink)", cursor: "pointer",
                                            }}
                                        >
                                            {groupsIndex.map((g) => (
                                                <option key={g.id} value={g.id}>{g.name}</option>
                                            ))}
                                        </select>
                                        <Icon name="chevron-down" size={14} style={{ position: "absolute", right: 10, top: 12, pointerEvents: "none", color: "var(--muted)" }} />
                                    </div>
                                )}

                                <button
                                    className="bl-btn"
                                    onClick={() => setShowNewGroup((v) => !v)}
                                    style={{ background: "#fff", border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", gap: 6 }}
                                >
                                    <Icon name="plus" size={14} /> 新增球團
                                </button>

                                {group && (
                                    <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                                        <div style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", border: "1px solid #d8d2c0", borderRadius: 8, padding: "4px 10px" }}>
                                            <span style={{ fontSize: 12, color: "var(--muted)" }}>場地</span>
                                            <button className="bl-btn" onClick={() => changeCourts(-1)} style={{ background: "none", padding: 4, display: "flex" }}><Icon name="minus" size={14} /></button>
                                            <span style={{ fontFamily: "var(--f-num)", fontSize: 15, fontWeight: 600, minWidth: 18, textAlign: "center" }}>{group.courts}</span>
                                            <button className="bl-btn" onClick={() => changeCourts(1)} style={{ background: "none", padding: 4, display: "flex" }}><Icon name="plus" size={14} /></button>
                                        </div>

                                        <select
                                            value={group.mode}
                                            onChange={(e) => update((g) => ({ ...g, mode: e.target.value, mixed: e.target.value === "singles" ? false : g.mixed }))}
                                            style={{ background: "#fff", border: "1px solid #d8d2c0", borderRadius: 8, padding: "7px 10px", fontSize: 13 }}
                                        >
                                            <option value="doubles">雙打</option>
                                            <option value="singles">單打</option>
                                        </select>

                                        {group.mode === "doubles" && (
                                            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "var(--muted)", cursor: "pointer" }}>
                                                <input type="checkbox" checked={group.mixed} onChange={(e) => update((g) => ({ ...g, mixed: e.target.checked }))} />
                                                混雙限定
                                            </label>
                                        )}

                                        {!confirmDelete ? (
                                            <button className="bl-btn" onClick={() => setConfirmDelete(true)} style={{ background: "none", padding: 6, color: "var(--muted)" }} aria-label="刪除球團">
                                                <Icon name="trash-2" size={16} />
                                            </button>
                                        ) : (
                                            <div style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12 }}>
                                                <span style={{ color: "var(--coral)" }}>確定刪除？</span>
                                                <button className="bl-btn" onClick={deleteGroup} style={{ background: "var(--coral)", color: "#fff", borderRadius: 6, padding: "4px 8px" }}>刪除</button>
                                                <button className="bl-btn" onClick={() => setConfirmDelete(false)} style={{ background: "#fff", border: "1px solid #d8d2c0", borderRadius: 6, padding: "4px 8px" }}>取消</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {showNewGroup && (
                                <div style={{ background: "#fff", border: "1px solid #d8d2c0", borderRadius: 12, padding: 16, marginBottom: 20, display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end" }}>
                                    <div>
                                        <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>球團名稱</label>
                                        <input
                                            value={newGroupName}
                                            onChange={(e) => setNewGroupName(e.target.value)}
                                            placeholder="例如：週三晚場臨打團"
                                            style={{ border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 10px", fontSize: 13, width: 200 }}
                                        />
                                    </div>
                                    <div>
                                        <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>場地數</label>
                                        <input
                                            type="number" min={1} max={20} value={newGroupCourts}
                                            onChange={(e) => setNewGroupCourts(Math.max(1, Math.min(20, Number(e.target.value) || 1)))}
                                            style={{ border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 10px", fontSize: 13, width: 80 }}
                                        />
                                    </div>
                                    <div>
                                        <label style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>模式</label>
                                        <select value={newGroupMode} onChange={(e) => setNewGroupMode(e.target.value)} style={{ border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 10px", fontSize: 13 }}>
                                            <option value="doubles">雙打</option>
                                            <option value="singles">單打</option>
                                        </select>
                                    </div>
                                    <button className="bl-btn" onClick={createGroup} style={{ background: "var(--court)", color: "#fff", borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 700 }}>建立</button>
                                    <button className="bl-btn" onClick={() => setShowNewGroup(false)} style={{ background: "none", color: "var(--muted)", fontSize: 13, padding: "9px 6px" }}>取消</button>
                                </div>
                            )}

                            {!storageOk && (
                                <div style={{ background: "#fbe6e2", color: "#8a2d1e", borderRadius: 8, padding: "8px 12px", fontSize: 13, marginBottom: 16 }}>
                                    資料儲存失敗，請檢查網路連線。
                                </div>
                            )}

                            {group && (
                                <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-start" }}>
                                    {/* Courts */}
                                    <div style={{ flex: "1 1 520px", minWidth: 300 }}>
                                        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 12 }}>
                                            {group.courtsState.map((c, i) => {
                                                const perCourt = group.mode === "singles" ? 2 : 4;
                                                const canManualAssign = !c.matchIds && selected.length === perCourt;
                                                return (
                                                    <div
                                                        key={i}
                                                        style={{
                                                            borderRadius: 12,
                                                            minHeight: 168,
                                                            padding: 14,
                                                            display: "flex",
                                                            flexDirection: "column",
                                                            background: c.matchIds ? "var(--court)" : "#fff",
                                                            border: c.matchIds ? "none" : "1.5px dashed #cfc8b3",
                                                            color: c.matchIds ? "#fff" : "var(--ink)",
                                                        }}
                                                    >
                                                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                                                            <span style={{ fontFamily: "var(--f-num)", fontSize: 13, fontWeight: 600, letterSpacing: 0.5, opacity: c.matchIds ? 0.85 : 0.6 }}>
                                                                場地 {i + 1}
                                                            </span>
                                                            {c.matchIds ? (
                                                                <span style={{ display: "flex", alignItems: "center", gap: 4, fontFamily: "var(--f-num)", fontSize: 15, fontWeight: 600 }}>
                                                                    <Icon name="clock" size={13} /> {fmtElapsed(c.startedAt, now)}
                                                                </span>
                                                            ) : (
                                                                <span style={{ fontSize: 12, color: "var(--muted)" }}>空場</span>
                                                            )}
                                                        </div>

                                                        {c.matchIds ? (
                                                            <>
                                                                <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 4, marginBottom: 10 }}>
                                                                    {c.matchIds.map((pid) => {
                                                                        const p = group.players.find((x) => x.id === pid);
                                                                        if (!p) return null;
                                                                        const lv = levelInfo(p.level);
                                                                        return (
                                                                            <div key={pid} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5 }}>
                                                                                <span style={{ width: 7, height: 7, borderRadius: 4, background: lv.color, flexShrink: 0 }} />
                                                                                <span>{p.name}</span>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                                <button
                                                                    className="bl-btn"
                                                                    onClick={() => handleEnd(i)}
                                                                    style={{ background: "rgba(255,255,255,0.15)", color: "#fff", borderRadius: 8, padding: "7px 0", fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                                                                >
                                                                    <Icon name="square" size={12} /> 結束比賽
                                                                </button>
                                                            </>
                                                        ) : (
                                                            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
                                                                <button
                                                                    className="bl-btn"
                                                                    disabled={!canManualAssign}
                                                                    onClick={() => assignManual(i)}
                                                                    style={{
                                                                        fontSize: 12.5, fontWeight: 600, borderRadius: 8, padding: "8px 14px",
                                                                        background: canManualAssign ? "var(--yellow)" : "#f1efe6",
                                                                        color: canManualAssign ? "#4A3708" : "#a9a290",
                                                                        cursor: canManualAssign ? "pointer" : "default",
                                                                    }}
                                                                >
                                                                    {canManualAssign ? `指派 ${selected.length} 人到此場` : `選 ${perCourt} 位候補後指派`}
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Sidebar */}
                                    <div style={{ width: 320, flex: "0 0 320px", background: "var(--panel)", borderRadius: 12, padding: 16 }}>
                                        <button
                                            className="bl-btn"
                                            onClick={handleAutoAssign}
                                            style={{ width: "100%", background: "var(--yellow)", color: "#4A3708", borderRadius: 10, padding: "12px 0", fontSize: 14.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 8 }}
                                        >
                                            <Icon name="shuffle" size={16} /> 自動排點
                                        </button>
                                        {assignMsg && <div style={{ fontSize: 12, color: "var(--muted)", textAlign: "center", marginBottom: 8 }}>{assignMsg}</div>}

                                        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
                                            <input
                                                value={pName}
                                                onChange={(e) => setPName(e.target.value)}
                                                onKeyDown={(e) => e.key === "Enter" && addPlayer()}
                                                placeholder="球友姓名"
                                                style={{ flex: 1, border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 10px", fontSize: 13, minWidth: 0, background: "#fff" }}
                                            />
                                            <select value={pLevel} onChange={(e) => setPLevel(Number(e.target.value))} style={{ border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 4px", fontSize: 12.5, background: "#fff" }}>
                                                {LEVELS.map((l) => <option key={l.v} value={l.v}>{l.label}</option>)}
                                            </select>
                                            <select value={pGender} onChange={(e) => setPGender(e.target.value)} style={{ border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 4px", fontSize: 12.5, background: "#fff" }}>
                                                <option value="M">男</option>
                                                <option value="F">女</option>
                                            </select>
                                            <button className="bl-btn" onClick={addPlayer} style={{ background: "var(--court)", color: "#fff", borderRadius: 8, padding: "0 12px", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                                <Icon name="plus" size={16} />
                                            </button>
                                        </div>

                                        <button
                                            className="bl-btn"
                                            onClick={() => setShowImport((v) => !v)}
                                            style={{ background: "none", color: "var(--muted)", fontSize: 12, display: "flex", alignItems: "center", gap: 4, padding: "0 0 12px" }}
                                        >
                                            <Icon name="upload" size={12} /> 批次匯入球友 <Icon name="chevron-down" size={12} style={{ transform: showImport ? "rotate(180deg)" : "none" }} />
                                        </button>

                                        {showImport && (
                                            <div style={{ background: "#fff", border: "1px solid #d8d2c0", borderRadius: 10, padding: 10, marginBottom: 14 }}>
                                                <textarea
                                                    value={importText}
                                                    onChange={(e) => setImportText(e.target.value)}
                                                    placeholder={"每行一位球友，可加逗號註明等級與性別：\\n小明,中階,男\\n小華,女\\n小美"}
                                                    rows={4}
                                                    style={{ width: "100%", border: "1px solid #e5e0d1", borderRadius: 8, padding: 8, fontSize: 12.5, fontFamily: "var(--f-body)", resize: "vertical", boxSizing: "border-box" }}
                                                />
                                                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8, gap: 8 }}>
                                                    <label className="bl-btn" style={{ fontSize: 12, color: "var(--muted)", display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
                                                        <Icon name="upload" size={12} /> 上傳 .txt / .csv
                                                        <input type="file" accept=".txt,.csv" onChange={handleImportFile} style={{ display: "none" }} />
                                                    </label>
                                                    <span style={{ fontSize: 11.5, color: "var(--muted)" }}>
                                                        {parseImportLines(importText).length > 0 ? `偵測到 ${parseImportLines(importText).length} 位球友` : "尚未輸入"}
                                                    </span>
                                                </div>
                                                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                                                    <button
                                                        className="bl-btn"
                                                        onClick={confirmImport}
                                                        disabled={parseImportLines(importText).length === 0}
                                                        style={{
                                                            flex: 1, borderRadius: 8, padding: "8px 0", fontSize: 12.5, fontWeight: 600,
                                                            background: parseImportLines(importText).length > 0 ? "var(--court)" : "#f1efe6",
                                                            color: parseImportLines(importText).length > 0 ? "#fff" : "#a9a290",
                                                        }}
                                                    >
                                                        確認匯入
                                                    </button>
                                                    <button
                                                        className="bl-btn"
                                                        onClick={() => { setShowImport(false); setImportText(""); }}
                                                        style={{ background: "#fff", border: "1px solid #d8d2c0", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, color: "var(--muted)" }}
                                                    >
                                                        取消
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600, color: "var(--muted)", marginBottom: 6 }}>
                                            <Icon name="users" size={13} /> 候補中（{group.players.filter((p) => p.status === "waiting").length}）
                                        </div>

                                        <div className="bl-scroll" style={{ maxHeight: 340, overflowY: "auto", display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
                                            {group.players
                                                .filter((p) => p.status === "waiting")
                                                .sort((a, b) => a.gamesPlayed - b.gamesPlayed || a.joinedAt - b.joinedAt)
                                                .map((p) => {
                                                    const lv = levelInfo(p.level);
                                                    const isSel = selected.includes(p.id);
                                                    return (
                                                        <div
                                                            key={p.id}
                                                            className="bl-row"
                                                            onClick={() => toggleSelect(p.id)}
                                                            style={{
                                                                display: "flex", alignItems: "center", gap: 8, background: isSel ? "#FCEFC8" : "#fff",
                                                                border: isSel ? "1.5px solid var(--yellow)" : "1.5px solid #e5e0d1",
                                                                borderRadius: 8, padding: "7px 9px", cursor: "pointer",
                                                            }}
                                                        >
                                                            <span style={{ width: 8, height: 8, borderRadius: 4, background: lv.color, flexShrink: 0 }} />
                                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                                <div style={{ fontSize: 13, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                                                                <div style={{ fontSize: 11, color: "var(--muted)" }}>
                                                                    {lv.label} · {p.gender === "M" ? "男" : "女"} · 已上場 {p.gamesPlayed} 場 · {fmtWait(p.joinedAt, now)}
                                                                </div>
                                                            </div>
                                                            <button className="bl-btn" onClick={(e) => { e.stopPropagation(); toggleRest(p.id); }} style={{ background: "none", padding: 4, color: "var(--muted)" }} aria-label="標記休息">
                                                                <Icon name="coffee" size={14} />
                                                            </button>
                                                            <button className="bl-btn" onClick={(e) => { e.stopPropagation(); removePlayer(p.id); }} style={{ background: "none", padding: 4, color: "var(--muted)" }} aria-label="移除">
                                                                <Icon name="x" size={14} />
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                            {group.players.filter((p) => p.status === "waiting").length === 0 && (
                                                <div style={{ fontSize: 12.5, color: "var(--muted)", padding: "10px 2px" }}>目前沒有候補球友，新增球友開始排點。</div>
                                            )}
                                        </div>

                                        <button
                                            className="bl-btn"
                                            onClick={() => setShowRest((v) => !v)}
                                            style={{ background: "none", color: "var(--muted)", fontSize: 12, display: "flex", alignItems: "center", gap: 4, padding: "4px 0" }}
                                        >
                                            <Icon name="circle-dot" size={12} /> 休息中（{group.players.filter((p) => p.status === "resting").length}） <Icon name="chevron-down" size={12} style={{ transform: showRest ? "rotate(180deg)" : "none" }} />
                                        </button>
                                        {showRest && (
                                            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 6 }}>
                                                {group.players.filter((p) => p.status === "resting").map((p) => (
                                                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: "1px solid #e5e0d1", borderRadius: 8, padding: "6px 9px" }}>
                                                        <div style={{ flex: 1, fontSize: 13 }}>{p.name}</div>
                                                        <button className="bl-btn" onClick={() => toggleRest(p.id)} style={{ background: "var(--court)", color: "#fff", borderRadius: 6, padding: "3px 8px", fontSize: 11.5 }}>
                                                            恢復候補
                                                        </button>
                                                    </div>
                                                ))}
                                                {group.players.filter((p) => p.status === "resting").length === 0 && (
                                                    <div style={{ fontSize: 12, color: "var(--muted)" }}>沒有休息中的球友。</div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<BadmintonLineup />);
    </script>
</body>
</html>
